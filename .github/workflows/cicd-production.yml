name: Deploy Angular to VPS

on:
  push:
    branches:
      - prod   # Branche de production

jobs:
  deploy:
    name: Build and Deploy Angular
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Install dependencies & build Angular
      - name: Install & build Angular
        run: |
          npm ci
          npm run build -- --configuration=production

      # 4️⃣ Setup SSH key
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 5️⃣ Ensure remote directory exists and has correct permissions
      - name: Prepare remote directory
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            sudo mkdir -p /var/www/prod/kompozith-website-frontend
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /var/www/prod
          "

      # 6️⃣ Rsync build to VPS
      - name: Deploy build via rsync
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./dist/kompozith-website/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/prod/kompozith-website-frontend/

      # 7️⃣ Set final permissions for Nginx
      - name: Set permissions on VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            sudo chown -R www-data:www-data /var/www/prod/kompozith-website-frontend
            sudo chmod -R 755 /var/www/prod/kompozith-website-frontend
          "
