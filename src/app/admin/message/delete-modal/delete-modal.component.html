<div class="modal-header">
  <h5 class="modal-title" id="myModalLabel160">{{ title }}</h5>
  <button (click)="exitModal()" cButtonClose></button>
</div>
<div class="modal-body" tabindex="0" ngbAutofocus>
  {{ message }}
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="exitModal()" cButton>
    Annuler
  </button>
  <button type="button" class="btn btn-primary text-light" (click)="delete()" cButton>
    Supprimer
  </button>
</div>
