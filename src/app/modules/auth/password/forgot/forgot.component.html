<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
    <c-container breakpoint="md">
      <c-row class="justify-content-center">
        <c-col lg="10" xl="8">
          <c-card-group>
            <c-card class="p-4">
              <c-card-body>
                <form cForm [formGroup]="form" (ngSubmit)="submit()">
                  <h1 [routerLink]="['/']">
                    <img class="logo" src="../../../../assets/images/logo-light.svg" alt="{{'signIn' | translate}}">
                  </h1>
                  <p class="text-body-secondary">Forgot password</p>
                  <div class="form-group mb-3">
                    <div class="form-floating-custom">
                      <input type="email" formControlName="email" class="form-control" id="email" placeholder=""
                        [ngClass]="{
                          'is-invalid': form.get('email')?.invalid && (submitted || form.get('email')?.touched), 'invalid-input': form.get('email')?.invalid && (submitted || form.get('email')?.touched), 'valid-input': form.get('email')?.valid,
                          'initial-input': form.get('email')?.errors?.['required']
                        }"
                      />
                      <label for="email">Email address</label>
                    </div>
                    <div
                      *ngIf="
                        form.get('email')?.invalid &&
                        (submitted || form.get('email')?.touched || form.get('email')?.errors?.['used'])
                      "
                      class="invalid-feedback"
                    >
                      <div *ngIf="form.get('email')?.errors?.['required']">
                        {{ 'form.validator.emailRequired' | translate }}
                      </div>
                      <div *ngIf="form.get('email')?.errors?.['email'] ">
                        {{ 'form.validator.emailInvalid' | translate }}
                      </div>
                      <div *ngIf="form.get('email')?.errors?.['used']">
                        {{ 'form.validator.emailAlreadyUsed' | translate }}
                      </div>
                    </div>
                  </div>
                  <div class="col-xl-12 col-lg-12 col-sm-12 col-12">
                      <app-http-response-status></app-http-response-status>
                  </div>
                  <c-row>
                    <c-col>
                      <button *ngIf="!fetching" type="submit" cButton class="px-4" color="primary">
                        Submit
                      </button>
                      <button *ngIf="fetching" class="btn btn-primary" type="button" disabled>
                          <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                          {{ 'form.text_8' | translate }}
                      </button>
                    </c-col>
                  </c-row>
                </form>
              </c-card-body>
            </c-card>
            <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
              <c-card-body class="d-flex align-items-center justify-content-center text-center">
                <div>
                  <h2>Sign In</h2>
                  <p>
                    Vous souvenez vous de votre mot de passe ?
                  </p>
                  <button [active]="true" cButton class="mt-3" color="primary" [routerLink]="['/auth/login']">
                    SignIn
                  </button>
                </div>
              </c-card-body>
            </c-card>
          </c-card-group>
        </c-col>
      </c-row>
    </c-container>
  </div>
