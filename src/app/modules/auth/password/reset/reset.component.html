<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
    <c-container breakpoint="md">
      <c-row class="justify-content-center">
        <c-col lg="10" xl="8">
          <c-card-group>
            <c-card class="p-4">
              <c-card-body>
                <form cForm [formGroup]="form" (ngSubmit)="submit()">
                  <h1 [routerLink]="['/']">
                    <img class="logo" src="../../../../assets/images/logo-light.svg" alt="{{'signIn' | translate}}">
                  </h1>
                  <p class="text-body-secondary">Reset your password</p>
                  <div class="form-group mb-3">
                    <div class="form-floating-custom input-group">
                      <input class="form-control" formControlName="password" [type]="passwordFunctions.hashedPassword ? 'password' : 'text'" id="password" placeholder=""
                        [ngClass]="{
                          'is-invalid': form.get('password')?.invalid && (submitted || form.get('password')?.touched), 'invalid-input': form.get('password')?.invalid && (submitted || form.get('password')?.touched), 'valid-input': form.get('password')?.valid,
                          'initial-input': form.get('password')?.errors?.['required']
                        }"
                      />
                      <label for="password">Password</label>
                    </div>
                    <div
                      *ngIf="
                        form.get('password')?.invalid &&
                        (submitted || form.get('password')?.touched)
                      "
                      class="invalid-feedback"
                    >
                      <div *ngIf="form.get('password')?.errors?.['required']">
                        {{ 'form.validator.passwordRequired' | translate }}
                      </div>
                      <div *ngIf="form.get('password')?.errors?.['minlength']">
                        <p [translate]="'form.validator.passwordMinLength'" [translateParams]="{ minLength: passwordHeleper.pwdMinLength}"></p>
          
                      </div>
                      <div *ngIf="form.get('password')?.errors?.['pattern'] && !form.get('password')?.errors?.['minlength']">
                        {{ 'form.validator.passwordInvalid' | translate }}
                      </div>
                    </div>
                  </div>
                  <password-validator-template [form]="form" 
                    *ngIf="!form.get('password')?.errors?.['required'] && form.get('password')?.invalid"
                  ></password-validator-template>
                  <div class="form-group mb-3">
                    <div class="form-floating-custom input-group">
                      <input class="form-control" formControlName="passwordConfirm" [type]="passwordFunctions.hashedPassword ? 'password' : 'text'" id="passwordcomfirm" placeholder=""
                        [ngClass]="{
                          'is-invalid':
                            (submitted || form.get('passwordConfirm')?.touched) &&
                            form.get('passwordConfirm')?.invalid
                        }"
                      />
                      <label for="passwordcomfirm">Password Confirm</label>
                      <span
                        class="input-group-text"
                        id="togglePassword"
                        (click)="passwordFunctions.togglePasswordVisibility()"
                      >
                        <i
                          class="fas toggle-password"
                          [ngClass]="
                            passwordFunctions.hashedPassword ? 'fa-eye-slash' : 'fa-eye'
                          "
                        ></i>
                      </span>
                    </div>
                    <div
                      *ngIf="
                        (submitted || form.get('passwordcomfirm')?.touched) &&
                        form.get('passwordcomfirm')?.invalid
                      "
                    >
                      <div
                        *ngIf="form.get('passwordcomfirm')?.errors?.['notEquivalent']"
                        class="invalid-feedback"
                      >
                      {{ 'form.validator.passwordConfirmNoMatch' | translate }}
                      </div>
                    </div>
                  </div>
                  <div class="col-xl-12 col-lg-12 col-sm-12 col-12">
                      <app-http-response-status></app-http-response-status>
                  </div>
                  <c-row>
                    <c-col>
                      <button *ngIf="!fetching" type="submit" cButton class="px-4" color="primary">
                        Submit
                      </button>
                      <button *ngIf="fetching" class="btn btn-primary" type="button" disabled>
                          <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                          {{ 'form.text_8' | translate }}
                      </button>
                    </c-col>
                  </c-row>
                </form>
              </c-card-body>
            </c-card>
            <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
              <c-card-body class="d-flex align-items-center justify-content-center text-center">
                <div>
                  <h2>Sign In</h2>
                  <p>
                    Vous souvenez vous de votre mot de passe ?
                  </p>
                  <button [active]="true" cButton class="mt-3" color="primary" [routerLink]="['/auth/login']">
                    SignIn
                  </button>
                </div>
              </c-card-body>
            </c-card>
          </c-card-group>
        </c-col>
      </c-row>
    </c-container>
  </div>
